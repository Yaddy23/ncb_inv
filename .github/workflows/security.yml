# Security CI/CD Pipeline
# Runs security scans, dependency audits, and Playwright E2E tests
# Triggers on: push to main, pull requests, scheduled daily runs

name: Security & Quality Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 02:30 UTC (avoids peak GitHub Actions usage)
    - cron: '30 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write  # For SARIF uploads
  actions: read

jobs:
  # ==========================================
  # BACKEND SECURITY SCANS
  # ==========================================
  backend-security:
    name: Backend Security Scans
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for GitLeaks history scan

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --- npm audit ---
      - name: Run npm audit (high+)
        id: npm-audit
        run: |
          npm audit --audit-level=high --json > npm-audit.json || true
          HIGH_COUNT=$(jq '[.vulnerabilities[] | select(.severity=="high" or .severity=="critical")] | length' npm-audit.json)
          echo "high_count=$HIGH_COUNT" >> $GITHUB_OUTPUT
          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "::error::Found $HIGH_COUNT high/critical vulnerabilities"
            cat npm-audit.json | jq -r '.vulnerabilities[] | select(.severity=="high" or .severity=="critical") | "\(.name)@\(.version): \(.title) [\(.severity)]"'
          fi

      # --- Snyk (requires SNYK_TOKEN secret) ---
      - name: Run Snyk test
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --json-file-output=snyk-results.json || true

      # --- GitLeaks (secrets scanning) ---
      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --verbose --redact --config-path=.gitleaks.toml

      # --- OWASP ZAP Baseline Scan (requires running backend) ---
      - name: Start backend for ZAP scan
        if: github.event_name != 'schedule'
        run: |
          npm start &
          sleep 10
          curl -f http://localhost:8080/health || exit 1

      - name: Run OWASP ZAP Baseline Scan
        if: github.event_name != 'schedule'
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
          fail_action: false
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

      # --- Upload SARIF results ---
      - name: Upload npm audit SARIF
        if: steps.npm-audit.outputs.high_count > 0
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/npm-audit.json
          category: npm-audit

      - name: Upload Snyk SARIF
        if: env.SNYK_TOKEN != '' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/snyk-results.json
          category: snyk

  # ==========================================
  # FRONTEND SECURITY SCANS
  # ==========================================
  frontend-security:
    name: Frontend Security Scans
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --- npm audit ---
      - name: Run npm audit (high+)
        id: npm-audit
        run: |
          npm audit --audit-level=high --json > npm-audit.json || true
          HIGH_COUNT=$(jq '[.vulnerabilities[] | select(.severity=="high" or .severity=="critical")] | length' npm-audit.json)
          echo "high_count=$HIGH_COUNT" >> $GITHUB_OUTPUT
          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "::error::Found $HIGH_COUNT high/critical vulnerabilities"
            cat npm-audit.json | jq -r '.vulnerabilities[] | select(.severity=="high" or .severity=="critical") | "\(.name)@\(.version): \(.title) [\(.severity)]"'
          fi

      # --- Snyk ---
      - name: Run Snyk test
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --json-file-output=snyk-results.json || true

      # --- Upload SARIF ---
      - name: Upload npm audit SARIF
        if: steps.npm-audit.outputs.high_count > 0
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: frontend/npm-audit.json
          category: npm-audit

      - name: Upload Snyk SARIF
        if: env.SNYK_TOKEN != '' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: frontend/snyk-results.json
          category: snyk

  # ==========================================
  # PLAYWRIGHT E2E TESTS
  # ==========================================
  playwright-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        env:
          MONGO_INITDB_DATABASE: TESTNCBINVENTORY
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: frontend

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Start backend server
        run: |
          npm start &
          sleep 15
          curl -f http://localhost:8080/health || exit 1
        working-directory: backend
        env:
          MONGODB_URI: mongodb://localhost:27017/TESTNCBINVENTORY
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci-only-do-not-use-in-production
          CLIENT_URL: http://localhost:4173
          PORT: 8080

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8080/api

      - name: Start frontend preview server
        run: |
          npx serve -s dist -l 4173 &
          sleep 5
          curl -f http://localhost:4173 || exit 1
        working-directory: frontend

      - name: Run Playwright tests
        run: npx playwright test --reporter=line
        working-directory: frontend
        env:
          TESTMONGODB_URI: mongodb://localhost:27017/TESTNCBINVENTORY
          VITE_API_URL: http://localhost:8080/api
          PLAYWRIGHT_BASE_URL: http://localhost:4173

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 7

  # ==========================================
  # CONTAINER/DEPENDENCY SCANNING (Trivy)
  # ==========================================
  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ==========================================
  # SUMMARY & STATUS
  # ==========================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs:
      - backend-security
      - frontend-security
      - playwright-tests
      - trivy-scan
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "## Security Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Security | ${{ needs.backend-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Security | ${{ needs.frontend-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Playwright E2E | ${{ needs.playwright-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy Scan | ${{ needs.trivy-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Fail if any required job failed
          if [ "${{ needs.backend-security.result }}" != "success" ] || \
             [ "${{ needs.frontend-security.result }}" != "success" ] || \
             [ "${{ needs.playwright-tests.result }}" != "success" ] || \
             [ "${{ needs.trivy-scan.result }}" != "success" ]; then
            echo "::error::One or more security checks failed"
            exit 1
          fi
          echo "✅ All security checks passed" >> $GITHUB_STEP_SUMMARY